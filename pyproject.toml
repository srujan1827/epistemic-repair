[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-repair"
version = "0.1.0"
description = "A deterministic toy environment for studying cause-aware epistemic repair."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gemini = ["google-genai>=2.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
